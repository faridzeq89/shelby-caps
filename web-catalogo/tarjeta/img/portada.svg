<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="SHELBY CAPS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171717"/>
      <stop offset="55%" stop-color="#0c0c0c"/>
      <stop offset="100%" stop-color="#2a1013"/>
    </linearGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8323a"/>
      <stop offset="100%" stop-color="#7c1319"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- Repisa de gorras, mismo trazo de dos piezas (domo + visera) que ya usa
       el resto del catálogo (ver img/banner-1.svg), solo reacomodado para
       leerse como anaquel de boutique. -->
  <g opacity="0.9">
    <g transform="translate(150 300) scale(0.65)">
      <path d="M-90 20 Q-90 -50 0 -50 Q90 -50 90 20 Z" fill="#2b2b2b"/>
      <path d="M-94 20 Q0 8 150 26 Q150 46 0 46 Q-94 46 -94 20 Z" fill="#1a1a1a"/>
    </g>
    <g transform="translate(330 290) scale(0.8)">
      <path d="M-90 20 Q-90 -50 0 -50 Q90 -50 90 20 Z" fill="url(#wine)"/>
      <path d="M-94 20 Q0 8 150 26 Q150 46 0 46 Q-94 46 -94 20 Z" fill="#5c0f14"/>
    </g>
    <g transform="translate(560 300) scale(0.7)">
      <path d="M-90 20 Q-90 -50 0 -50 Q90 -50 90 20 Z" fill="#3a3a3a"/>
      <path d="M-94 20 Q0 8 150 26 Q150 46 0 46 Q-94 46 -94 20 Z" fill="#232323"/>
    </g>
  </g>

  <!-- Trama sutil de rombos, mismo guiño textil que portada.svg original. -->
  <g opacity="0.05" fill="none" stroke="#EDE7D8" stroke-width="1.5">
    <path d="M0 60 L1200 60 M0 140 L1200 140 M0 220 L1200 220 M0 300 L1200 300 M0 380 L1200 380"/>
  </g>

  <text x="740" y="185" font-family="Nunito Sans, Segoe UI, sans-serif" font-size="64"
        font-weight="900" fill="#F4F4F4" letter-spacing="1">SHELBY CAPS</text>
  <rect x="742" y="205" width="230" height="4" fill="url(#wine)"/>
  <text x="740" y="248" font-family="Nunito Sans, Segoe UI, sans-serif" font-size="24"
        font-weight="700" fill="#c9c9c9">Gorras originales · réplica premium · personalizadas</text>
</svg>
